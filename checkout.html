<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout — [NAMA CAFE]</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/responsive.css"></head><body><header class="site-header"><a class="logo" href="index.html"><span class="logo-mark">N</span><span data-cafe-name>[NAMA CAFE]</span></a></header><main><section class="section"><div class="page-head compact"><p class="eyebrow">CHECKOUT</p><h1>Selesaikan pesanan</h1></div><div class="checkout-layout"><form id="checkout-form" class="panel form-grid"><label>Nama<input id="name" required></label><label>Nomor WhatsApp<input id="phone" type="tel" required></label><label>Email<input id="email" type="email"></label><label>Order type<select id="order-type"><option value="dine-in">Dine In</option><option value="take-away">Take Away</option><option value="delivery">Delivery</option></select></label><label id="table-field">Nomor meja<input id="table"></label><label id="delivery-fields">Alamat lengkap<textarea id="address"></textarea></label><label>Catatan delivery<textarea id="notes"></textarea></label><label>Metode pembayaran<select id="payment"><option>QRIS</option><option>Cash</option><option>Bank Transfer</option><option>E-Wallet</option></select></label><div class="payment-note"><strong>QRIS</strong><p>QRIS adalah placeholder. Pembayaran tidak diverifikasi otomatis pada versi static ini.</p><img src="assets/images/qris-placeholder.svg" alt="QRIS placeholder"></div><button class="btn primary full">Buat Pesanan</button></form><aside class="summary-card"><h2>Ringkasan</h2><form id="promo-form" class="promo-form"><input id="promo-code" placeholder="Kode voucher"><button class="btn ghost">Pakai</button></form><div id="checkout-summary"></div></aside></div></section></main><div id="toast" class="toast"></div><script src="js/config.js"></script><script src="js/data.js"></script><script src="js/app.js"></script><script src="js/checkout.js"></script></body></html>
